services:
  - type: web
    name: bot-whatsapp
    env: node
    plan: free
    buildCommand: PUPPETEER_CACHE_DIR=/opt/render/.cache/puppeteer npm install && npx puppeteer browsers install chrome
    startCommand: node index.js
    envVars:
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer